version: "1.0"
behavior: privacy-consent-retention
classification:
  values: [public, internal, confidential, personal, sensitive]
  precedence: [sensitive, personal, confidential, public, internal]
consent:
  required: [id, tenantId, dataSubjectId, purpose, categories, decision, evidenceHash, source, grantedAt, revision]
  decision: [grant, deny]
  status: [active, withdrawn, denied, expired]
  evidenceHash: sha256
  sources: [web, api, conversation, paper, signed_document]
  withdrawalRequires: [actorId, expectedRevision, reason]
processing:
  required: [id, tenantId, dataSubjectId, category, classification, purpose, createdAt]
  legalBasis: [consent, contract, legal_obligation, legitimate_interest, vital_interest, public_task]
  personalDataRequiresLegalBasis: true
  consentRequires: [tenantMatch, subjectMatch, purposeMatch, categoryMatch, activeStatus, nonExpired, grantedBeforeProcessing]
retention:
  required: [tenantId, retentionDays, legalHold]
  maxRetentionDays: 36500
  outcomes: [retained, deletion_due, on_hold]
invariants:
  - tenant-isolation
  - consent-purpose-and-category-limitation
  - consent-withdrawal-revision-control
  - no-processing-without-valid-basis
  - consent-must-precede-processing
  - retention-expiry-enforced
  - legal-hold-prevents-deletion
errors:
  - { code: CONSENT_EVIDENCE_HASH_INVALID, path: evidenceHash }
  - { code: CONSENT_NOT_ACTIVE, path: consent.status }
  - { code: PROCESSING_CONSENT_SCOPE_MISMATCH, path: consentId }
  - { code: PROCESSING_PRIVACY_BASIS_REQUIRED, path: legalBasis }
  - { code: PROCESSING_RETENTION_EXPIRED, path: retentionUntil }
  - { code: RETENTION_POLICY_INVALID, path: retentionDays }
