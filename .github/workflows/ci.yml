name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oaas
          POSTGRES_PASSWORD: oaas_test
          POSTGRES_DB: oaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oaas -d oaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://oaas:oaas_test@localhost:5432/oaas_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean checked-in partial node_modules and install dependencies
        run: rm -rf node_modules && npm install --include=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end journeys (chat and Discovery)
        run: npm run test:e2e
      - name: Build
        run: npm run build
