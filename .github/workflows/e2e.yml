name: E2E (Vite + Playwright)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean checked-in partial node_modules and install dependencies
        run: rm -rf node_modules && npm install --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
