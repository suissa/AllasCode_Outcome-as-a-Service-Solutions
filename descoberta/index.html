":"investment","label":"Como é o limite de investimento?","type":"single","order":2,"required":false,"allowUnknown":true,"options":[{"value":"limited","label":"Limitado"},{"value":"flexible","label":"Flexível conforme retorno"},{"value":"unknown","label":"Ainda não definido"}]},{"id":"deadline","label":"Existe prazo obrigatório?","type":"single","order":3,"required":false,"allowUnknown":true,"options":[{"value":"immediate","label":"Imediato"},{"value":"30d","label":"30 dias"},{"value":"60d","label":"60 dias"},{"value":"90d","label":"90 dias"},{"value":"flexible","label":"Flexível"}]},{"id":"constraints","label":"Existem restrições?","type":"multi","order":4,"required":false,"allowUnknown":true,"options":[{"value":"technical","label":"Tecnológicas"},{"value":"financial","label":"Financeiras"},{"value":"operational","label":"Operacionais"},{"value":"legal","label":"Jurídicas/contratuais"},{"value":"none","label":"Nenhuma conhecida"}]},{"id":"approver","label":"Quem aprova a implementação?","type":"single","order":5,"required":false,"allowUnknown":true,"options":[{"value":"owner","label":"Proprietário"},{"value":"manager","label":"Gestor"},{"value":"team","label":"Equipe"},{"value":"board","label":"Conselho"},{"value":"other","label":"Outro"}]},{"id":"diagnosis_validation","label":"O resumo do diagnóstico representa a realidade?","type":"single","order":6,"required":false,"allowUnknown":true,"options":[{"value":"confirmed","label":"Sim, confirmado"},{"value":"partial","label":"Parcialmente"},{"value":"corrections","label":"Precisa de correções"}]}]}],"solutions":[{"id":"SOL-SALES-001","name":"Recuperação de oportunidades comerciais","description":"Organizar interessados, identificar desistências e executar acompanhamento com rastreabilidade.","signals":["lead_registration:partial","lead_registration:none","abandonment_tracking:no","conversion_tracking:unknown","conversion_tracking:partial"],"metrics":["Taxa de conversão","Vendas recuperadas"],"evidence":["Histórico de atendimentos","Registros de vendas"],"effort":"Médio"},{"id":"SOL-SALES-002","name":"Otimização da conversão","description":"Medir o funil e reduzir perdas por demora, falta de acompanhamento ou motivos recorrentes de desistência.","signals":["response_time:slow","abandonment_frequency:often","abandonment_frequency:sometimes","conversion_tracking:unknown"],"metrics":["Tempo de resposta","Conversão por canal"],"evidence":["Atendimentos e vendas"],"effort":"Médio"},{"id":"SOL-MKT-001","name":"Marketing orientado a resultados","description":"Relacionar campanhas, origem dos contatos e vendas para investir nos canais que geram resultado.","signals":["campaign_frequency:sometimes","campaign_frequency:never","campaign_measurement:no","campaign_measurement:partial"],"metrics":["Vendas por campanha","Custo de aquisição"],"evidence":["Campanhas e origem das vendas"],"effort":"Médio"},{"id":"SOL-CRM-001","name":"Reativação de clientes","description":"Segmentar a base e criar ações de reativação com medição de retorno.","signals":["proactive_contact:no","customer_base:partial","repeat_purchase:some","repeat_purchase:high"],"metrics":["Clientes reativados","Receita recorrente"],"evidence":["Base de clientes e compras"],"effort":"Baixo a médio"},{"id":"SOL-CRM-002","name":"Fidelização e recorrência","description":"Estruturar relacionamento e medir frequência, retenção e retorno dos clientes.","signals":["loyalty_program:no","loyalty_program:informal","repeat_tracking:no","repeat_tracking:partial"],"metrics":["Frequência de compra","Retenção"],"evidence":["Histórico de compras"],"effort":"Médio"},{"id":"SOL-STOCK-001","name":"Otimização de estoque e disponibilidade","description":"Analisar vendas por produto e variação para reduzir rupturas e melhorar disponibilidade.","signals":["stockout_frequency:often","stockout_frequency:sometimes","product_demand:no","product_demand:partial"],"metrics":["Ruptura de estoque","Vendas perdidas por indisponibilidade"],"evidence":["Movimentação de estoque e vendas"],"effort":"Médio"},{"id":"SOL-STOCK-002","name":"Previsão de demanda e reposição","description":"Usar histórico de vendas, sazonalidade e prazo de fornecedor para apoiar compras e reposição.","signals":["purchase_decision:experience","purchase_decision:manual","reorder_alerts:no","reorder_alerts:partial"],"metrics":["Acurácia de reposição","Giro de estoque"],"evidence":["Histórico de vendas e compras"],"effort":"Médio a alto"},{"id":"SOL-FIN-001","name":"Visibilidade financeira","description":"Consolidar fluxo de caixa, compromissos e projeções para apoiar decisões.","signals":["cash_forecast:partial","cash_forecast:no","monthly_profit:partial","monthly_profit:no"],"metrics":["Precisão da previsão de caixa","Lucro operacional"],"evidence":["Contas a pagar/receber e extratos"],"effort":"Médio"},{"id":"SOL-FIN-002","name":"Rentabilidade por produto ou serviço","description":"Apurar margem comparável por oferta e orientar mix, preço e priorização.","signals":["margin_knowledge:estimate","margin_knowledge:no","profitability_mix:no","profitability_mix:partial"],"metrics":["Margem de contribuição por oferta","Lucro por categoria"],"evidence":["Custos, preços e vendas"],"effort":"Médio"},{"id":"SOL-OPS-001","name":"Automação operacional","description":"Mapear tarefas repetitivas e automatizar etapas com regras claras e supervisão.","signals":["repetitive_tasks:many","repetitive_tasks:some","operational_bottleneck:overload"],"metrics":["Horas poupadas","Tempo de ciclo"],"evidence":["Mapa do processo e volume de tarefas"],"effort":"Variável"},{"id":"SOL-OPS-002","name":"Integração de sistemas","description":"Reduzir retrabalho e divergências conectando fontes de dados existentes.","signals":["integration:no","integration:partial"],"metrics":["Retrabalho","Consistência dos dados"],"evidence":["Inventário de sistemas e APIs"],"effort":"Variável"},{"id":"SOL-OPS-003","name":"Indicadores de gestão","description":"Definir indicadores, fontes, periodicidade e responsáveis para decisões baseadas em dados.","signals":["conversion_tracking:unknown","campaign_measurement:no","new_customer_tracking:no","cash_forecast:no"],"metrics":["Cobertura de indicadores","Atualização dos dados"],"evidence":["Fontes e definições dos indicadores"],"effort":"Baixo a médio"}]}</script>
<script>
(()=>{'use strict';
const config=JSON.parse(document.getElementById('discovery-config').textContent);
const root=document.getElementById('app');let index=0,answers={},transitioning=false,showResults=false;
const key=config.engine.storageKey;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.answers){answers=saved.answers;index=Math.min(saved.index||0,config.stages.length-1)}}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(key,JSON.stringify({index,answers,updatedAt:new Date().toISOString()}))}catch{}};
const stage=config.stages[index];
function getValue(id){return answers[id]?.value}
function setAnswer(q,value){answers[q.id]={value,status:value===''||value===null?'unknown':'provided',updatedAt:new Date().toISOString()};save()}
function renderQuestion(q){
 const value=getValue(q.id);
 let control='';
 if(q.type==='single'||q.type==='multi'){
  control='<div class="grid gap-2 sm:grid-cols-2">'+q.options.map(o=>'<label class="option"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="'+esc(q.id)+'" value="'+esc(o.value)+'" '+(q.type==='multi'?(Array.isArray(value)&&value.includes(o.value)?'checked':''):(value===o.value?'checked':''))+ '><span>'+esc(o.label)+'</span></label>').join('')+'</div>';
 }else if(q.type==='number'||q.type==='text'){
  control='<input class="field" type="'+(q.type==='number'?'number':'text')+'" '+(q.type==='number'?'min="0" step="any"':'')+' data-field="'+esc(q.id)+'" value="'+esc(value??'')+'" placeholder="'+(q.type==='number'?'Informe um valor ou deixe em branco':'Escreva sua resposta (opcional)')+'">';
 }
 const unknown='<button class="text-xs muted underline mt-2" data-unknown="'+esc(q.id)+'">Não sei / ainda não acompanho</button>';
 return '<section class="py-4 border-b last:border-0" style="border-color:var(--border)"><div class="flex gap-3 items-start mb-3"><span class="pill">'+String(q.order).padStart(2,'0')+'</span><div class="min-w-0"><h3 class="font-semibold">'+esc(q.label)+'</h3><p class="text-xs muted mt-1">Resposta opcional · você pode continuar sem esta informação</p></div></div>'+control+unknown+'</section>';
}
function shell(content){
 const pct=Math.round(((index+(showResults?1:0))/config.stages.length)*100);
 root.innerHTML='<div class="max-w-5xl mx-auto px-4 py-6 md:px-8"><header class="flex items-center justify-between gap-4 mb-7"><div><div class="text-xs tracking-[.2em] accent font-bold">GOALTROPIC</div><div class="text-lg font-semibold">Discovery Engine</div></div><div class="flex items-center gap-2"><span class="pill">'+(showResults?'DIAGNÓSTICO':('ETAPA '+(index+1)+' / '+config.stages.length))+'</span><button class="button button-secondary text-sm" id="themeToggle" type="button">Tema</button></div></header><div class="progress-track mb-2"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="flex justify-between text-xs muted mb-6"><span>'+pct+'% da jornada</span><span>'+Object.keys(answers).length+' respostas registradas</span></div><main id="screen" class="screen">'+content+'</main><footer class="mt-8 pt-4 border-t text-xs muted flex flex-wrap justify-between gap-2" style="border-color:var(--border)"><span>As respostas ficam salvas neste navegador.</span><button id="reset" class="underline">Limpar descoberta</button></footer></div>';
 document.getElementById('themeToggle').onclick=toggleTheme;document.getElementById('reset').onclick=reset;
}
function renderStage(){
 const s=config.stages[index];
 shell('<div class="panel p-5 md:p-8"><div class="flex flex-wrap items-center gap-2 mb-4"><span class="pill">DESCOBERTA</span><span class="text-xs muted">Fase '+(Math.floor(index/5)+1)+'</span></div><h1 class="text-2xl md:text-3xl font-semibold">'+esc(s.title)+'</h1><p class="muted mt-2 mb-5">'+esc(s.description)+'</p><div class="space-y-1">'+s.questions.map(renderQuestion).join('')+'</div><div class="flex flex-wrap items-center justify-between gap-3 pt-6 mt-3 border-t" style="border-color:var(--border)"><button class="button button-secondary" id="back" '+(index===0?'disabled':'')+'>Voltar</button><div class="flex gap-2"><button class="button button-secondary" id="skip">Pular etapa</button><button class="button button-primary" id="next">'+(index===config.stages.length-1?'Gerar diagnóstico':'Continuar')+' →</button></div></div></div>');
 document.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(el=>el.addEventListener('change',()=>{
  const q=s.questions.find(x=>x.id===el.name);if(!q)return;
  if(q.type==='multi'){const vals=[...document.querySelectorAll('input[name="'+q.id+'"]:checked')].map(x=>x.value);setAnswer(q,vals)}
  else setAnswer(q,el.value);
 }));
 document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{const q=s.questions.find(x=>x.id===el.dataset.field);setAnswer(q,el.value)}));
 document.querySelectorAll('[data-unknown]').forEach(el=>el.addEventListener('click',()=>{const q=s.questions.find(x=>x.id===el.dataset.unknown);setAnswer(q,null);el.textContent='Marcado como desconhecido'}));
 document.getElementById('back').onclick=()=>navigate(index-1);
 document.getElementById('skip').onclick=()=>navigate(index+1);
 document.getElementById('next').onclick=()=>{document.querySelectorAll('[data-field]').forEach(el=>{const q=s.questions.find(x=>x.id===el.dataset.field);if(el.value)setAnswer(q,el.value)});if(index===config.stages.length-1){showResults=true;showDiagnostic()}else navigate(index+1)};
}
function animate(el,cls,duration){
 return new Promise(resolve=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){resolve();return}
  let done=false;const finish=()=>{if(done)return;done=true;el.classList.remove('animate__animated',cls);resolve()};
  el.style.setProperty('--animate-duration',duration+'ms');el.classList.add('animate__animated',cls);
  el.addEventListener('animationend',e=>{if(e.target===el)finish()},{once:true});
  setTimeout(finish,duration+700);
 });
}
async function navigate(next){
 if(transitioning||next<0||next>=config.stages.length)return;transitioning=true;save();
 const current=document.getElementById('screen');await animate(current,config.animations.exit,config.animations.exitDurationMs);
 index=next;save();renderStage();
 const incoming=document.getElementById('screen');await animate(incoming,config.animations.enter,config.animations.enterDurationMs);
 transitioning=false;window.scrollTo({top:0,behavior:'smooth'});
}
function evaluate(){
 return config.solutions.map(sol=>{
  const hits=sol.signals.filter(sig=>{const [id,val]=sig.split(':');const v=getValue(id);return Array.isArray(v)?v.includes(val):v===val});
  const unknown=sol.signals.filter(sig=>{const [id]=sig.split(':');return getValue(id)===undefined||getValue(id)===null});
  const score=Math.min(100,Math.round(hits.length/Math.max(1,sol.signals.length)*100));
  return {...sol,hits,score,status:hits.length>=2?'recommended':hits.length===1?'needs_evidence':'not_applicable',unknown};
 }).filter(x=>x.status!=='not_applicable').sort((a,b)=>b.hits.length-a.hits.length||b.score-a.score);
}
function showDiagnostic(){
 const results=evaluate(),known=Object.entries(answers).filter(([,v])=>v.value!==null&&v.value!==''),unknown=Object.entries(answers).filter(([,v])=>v.value===null);
 const names=new Map(config.stages.flatMap(s=>s.questions.map(q=>[q.id,q.label])));
 const responseRows=known.map(([id,v])=>'<div class="flex justify-between gap-4 py-2 border-b text-sm" style="border-color:var(--border)"><span class="muted">'+esc(names.get(id)||id)+'</span><strong class="text-right">'+esc(Array.isArray(v.value)?v.value.join(', '):v.value)+'</strong></div>').join('');
 const solutionCards=results.length?results.map(r=>'<article class="solution"><div class="flex flex-wrap justify-between gap-2"><h3 class="font-semibold">'+esc(r.name)+'</h3><span class="pill">'+(r.status==='recommended'?'Sinal consistente':'Precisa de evidências')+'</span></div><p class="text-sm muted mt-2">'+esc(r.description)+'</p><div class="text-xs mt-3"><strong>'+r.hits.length+'</strong> sinal(is) compatível(is) identificado(s) · esforço: '+esc(r.effort)+'</div><div class="mt-3 text-xs"><strong>Indicadores:</strong> '+esc(r.metrics.join(' · '))+'</div><div class="mt-2 text-xs muted"><strong>Validar com:</strong> '+esc(r.evidence.join(' · '))+'</div></article>').join(''):'<p class="muted">Ainda não há combinações suficientes para sugerir soluções. Complete mais respostas ou revise os dados.</p>';
 shell('<div class="space-y-5"><section class="panel p-5 md:p-7"><span class="pill">RESULTADO DA DESCOBERTA</span><h1 class="text-2xl md:text-3xl font-semibold mt-3">Diagnóstico preliminar</h1><p class="muted mt-2">As recomendações abaixo são hipóteses baseadas nas respostas registradas. Não representam resultados comprovados nem substituem a validação das fontes.</p><div class="grid grid-cols-3 gap-3 mt-6"><div class="p-3 rounded-xl" style="background:var(--surface-2)"><div class="text-2xl font-semibold">'+known.length+'</div><div class="text-xs muted">Respostas preenchidas</div></div><div class="p-3 rounded-xl" style="background:var(--surface-2)"><div class="text-2xl font-semibold">'+unknown.length+'</div><div class="text-xs muted">Marcadas desconhecidas</div></div><div class="p-3 rounded-xl" style="background:var(--surface-2)"><div class="text-2xl font-semibold">'+results.length+'</div><div class="text-xs muted">Oportunidades sinalizadas</div></div></div></section><section class="panel p-5 md:p-7"><h2 class="text-xl font-semibold mb-4">Soluções possíveis</h2><div class="grid gap-3">'+solutionCards+'</div></section><section class="panel p-5 md:p-7"><h2 class="text-xl font-semibold mb-3">Respostas registradas</h2>'+responseRows+'</section><div class="flex flex-wrap justify-between gap-3"><button class="button button-secondary" id="review">Revisar respostas</button><button class="button button-primary" id="export">Exportar JSON</button></div></div>');
 document.getElementById('review').onclick=async()=>{showResults=false;index=config.stages.length-1;save();renderStage();await animate(document.getElementById('screen'),config.animations.enter,config.animations.enterDurationMs)};
 document.getElementById('export').onclick=()=>{const payload={schemaVersion:config.version,createdAt:new Date().toISOString(),answers,opportunities:results.map(({id,name,status,score,hits,metrics,evidence})=>({id,name,status,score,matchedSignals:hits,metrics,evidence}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='goaltropic-discovery.json';a.click();URL.revokeObjectURL(url)};
}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;document.body.dataset.theme=next;const t=next==='dark'?{bg:'#080B0F',surface:'#11161D',surface2:'#191F28',text:'#F2F2F0',muted:'#929AA5',accent:'#BC8E4F',border:'#29313C'}:{bg:'#F5F6F8',surface:'#FFFFFF',surface2:'#EDF0F4',text:'#171A20',muted:'#68717D',accent:'#92672D',border:'#D9DEE5'};const r=document.documentElement.style;r.setProperty('--bg',t.bg);r.setProperty('--surface',t.surface);r.setProperty('--surface-2',t.surface2);r.setProperty('--text',t.text);r.setProperty('--muted',t.muted);r.setProperty('--accent',t.accent);r.setProperty('--border',t.border)}
function reset(){if(!confirm('Apagar todas as respostas salvas desta descoberta?'))return;answers={};index=0;showResults=false;localStorage.removeItem(key);renderStage()}
if(showResults)showDiagnostic();else renderStage();
})();
</script>
</body></html>
