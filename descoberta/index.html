<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Descoberta estruturada de negócio e recomendação fundamentada de soluções Goaltropic.">
<title>Goaltropic · Discovery</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<style>
:root{color-scheme:dark;--bg:#080B0F;--surface:#11161D;--surface-2:#191F28;--text:#F2F2F0;--muted:#929AA5;--accent:#BC8E4F;--border:#29313C}
:root[data-theme="light"]{color-scheme:light;--bg:#F5F6F8;--surface:#fff;--surface-2:#EDF0F4;--text:#171A20;--muted:#68717D;--accent:#92672D;--border:#D9DEE5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{min-height:100vh}.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px}.muted{color:var(--muted)}.accent{color:var(--accent)}.button{border:1px solid var(--border);border-radius:11px;padding:11px 16px;font-weight:600;transition:.2s}.button:disabled{opacity:.4;cursor:not-allowed}.button-primary{background:var(--accent);color:#101010;border-color:var(--accent)}.button-secondary{background:var(--surface-2)}.option{display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);text-align:left;cursor:pointer}.option:has(input:checked){border-color:var(--accent);outline:1px solid var(--accent)}.option input{accent-color:var(--accent);margin-top:4px}.field{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text)}.progress-track{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:var(--accent);transition:width .25s}.screen{will-change:transform,opacity}.pill{font-size:11px;border:1px solid var(--border);padding:4px 8px;border-radius:99px;color:var(--muted)}.solution{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface-2)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="dark" data-oaas-page="discovery" data-config-root="../">
<div id="oaas-page-root"></div>
<script src="../page-config.js"></script>
<script>
(async()=>{'use strict';
const pageRuntime=await window.OaaSPageReady;
const config=pageRuntime.sources.discovery;
const root=document.getElementById('app');let index=0,answers={},transitioning=false,showResults=false;
const key=config.engine.storageKey;
let handoffSource=null;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.answers){answers=saved.answers;index=Math.min(saved.index||0,config.stages.length-1);if(saved.source==='guilda')handoffSource=saved.missionId||'guilda'}}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(key,JSON.stringify({index,answers,updatedAt:new Date().toISOString()}))}catch{}};
const stage=config.stages[index];
function getValue(id){return answers[id]?.value}
function setAnswer(q,value){answers[q.id]={value,status:value===''||value===null?'unknown':'provided',updatedAt:new Date().toISOString()};save()}
function renderQuestion(q){
 const value=getValue(q.id);
 let control='';
 if(q.type==='single'||q.type==='multi'){
  control='<div class="grid gap-2 sm:grid-cols-2">'+q.options.map(o=>'<label class="option"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="'+esc(q.id)+'" value="'+esc(o.value)+'" '+(q.type==='multi'?(Array.isArray(value)&&value.includes(o.value)?'checked':''):(value===o.value?'checked':''))+ '><span>'+esc(o.label)+'</span></label>').join('')+'</div>';
 }else if(q.type==='number'||q.type==='text'){
  control='<input class="field" type="'+(q.type==='number'?'number':'text')+'" '+(q.type==='number'?'min="0" step="any"':'')+' data-field="'+esc(q.id)+'" value="'+esc(value??'')+'" placeholder="'+(q.type==='number'?'Informe um valor ou deixe em branco':'Escreva sua resposta (opcional)')+'">';
 }
 const unknown='<button class="text-xs muted underline mt-2" data-unknown="'+esc(q.id)+'">Não sei / ainda não acompanho</button>';
 return '<section class="py-4 border-b last:border-0" style="border-color:var(--border)"><div class="flex gap-3 items-start mb-3"><span class="pill">'+String(q.order).padStart(2,'0')+'</span><div class="min-w-0"><h3 class="font-semibold">'+esc(q.label)+'</h3><p class="text-xs muted mt-1">Resposta opcional · você pode continuar sem esta informação</p></div></div>'+control+unknown+'</section>';
}
function shell(content){
 const pct=Math.round(((index+(showResults?1:0))/config.stages.length)*100);
 root.innerHTML='<div class="max-w-5xl mx-auto px-4 py-6 md:px-8"><header class="flex items-center justify-between gap-4 mb-7"><div><div class="text-xs tracking-[.2em] accent font-bold">GOALTROPIC</div><div class="text-lg font-semibold">Discovery Engine</div></div><div class="flex items-center gap-2"><span class="pill">'+(showResults?'DIAGNÓSTICO':('ETAPA '+(index+1)+' / '+config.stages.length))+'</span><button class="button button-secondary text-sm" id="themeToggle" type="button">Tema</button></div></header><div class="progress-track mb-2"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="flex justify-between text-xs muted mb-6"><span>'+pct+'% da jornada</span><span>'+Object.keys(answers).length+' respostas registradas</span></div>'+(handoffSource?'<div class="panel p-4 mb-5"><strong class="accent">Missão recebida do Modo Guilda</strong><p class="text-xs muted mt-1">As respostas iniciais foram preenchidas para evitar perguntas repetidas. Revise e complete o que estiver faltando.</p></div>':'')+'<main id="screen" class="screen">'+content+'</main><footer class="mt-8 pt-4 border-t text-xs muted flex flex-wrap justify-between gap-2" style="border-color:var(--border)"><span>As respostas ficam salvas neste navegador.</span><button id="reset" class="underline">Limpar descoberta</button></footer></div>';
 document.getElementById('themeToggle').onclick=toggleTheme;document.getElementById('reset').onclick=reset;
}
function renderStage(){
 const s=config.stages[index];
 shell('<div class="panel p-5 md:p-8"><div class="flex flex-wrap items-center gap-2 mb-4"><span class="pill">DESCOBERTA</span><span class="text-xs muted">Fase '+(Math.floor(index/5)+1)+'</span></div><h1 class="text-2xl md:text-3xl font-semibold">'+esc(s.title)+'</h1><p class="muted mt-2 mb-5">'+esc(s.description)+'</p><div class="space-y-1">'+s.questions.map(renderQuestion).join('')+'</div><div class="flex flex-wrap items-center justify-between gap-3 pt-6 mt-3 border-t" style="border-color:var(--border)"><button class="button button-secondary" id="back" '+(index===0?'disabled':'')+'>Voltar</button><div class="flex gap-2"><button class="button button-secondary" id="skip">Pular etapa</button><button class="button button-primary" id="next">'+(index===config.stages.length-1?'Gerar diagnóstico':'Continuar')+' →</button></div></div></div>');
 document.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(el=>el.addEventListener('change',()=>{
  const q=s.questions.find(x=>x.id===el.name);if(!q)return;
  if(q.type==='multi'){const vals=[...document.querySelectorAll('input[name="'+q.id+'"]:checked')].map(x=>x.value);setAnswer(q,vals)}
  else setAnswer(q,el.value);
 }));
 document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{const q=s.questions.find(x=>x.id===el.dataset.field);setAnswer(q,el.value)}));
 document.querySelectorAll('[data-unknown]').forEach(el=>el.addEventListener('click',()=>{const q=s.questions.find(x=>x.id===el.dataset.unknown);setAnswer(q,null);el.textContent='Marcado como desconhecido'}));
 document.getElementById('back').onclick=()=>navigate(index-1);
 document.getElementById('skip').onclick=()=>navigate(index+1);
 document.getElementById('next').onclick=()=>{document.querySelectorAll('[data-field]').forEach(el=>{const q=s.questions.find(x=>x.id===el.dataset.field);if(el.value)setAnswer(q,el.value)});if(index===config.stages.length-1){showResults=true;showDiagnostic()}else navigate(index+1)};
}
function animate(el,cls,duration){
 return new Promise(resolve=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){resolve();return}
  let done=false;const finish=()=>{if(done)return;done=true;el.classList.remove('animate__animated',cls);resolve()};
  el.style.setProperty('--animate-duration',duration+'ms');el.classList.add('animate__animated',cls);
  el.addEventListener('animationend',e=>{if(e.target===el)finish()},{once:true});
  setTimeout(finish,duration+700);
 });
}
async function navigate(next){
 if(transitioning||next<0||next>=config.stages.length)return;transitioning=true;save();
 const current=document.getElementById('screen');await animate(current,config.animations.exit,config.animations.exitDurationMs);
 index=next;save();renderStage();
 const incoming=document.getElementById('screen');await animate(incoming,config.animations.enter,config.animations.enterDurationMs);
 transitioning=false;window.scrollTo({top:0,behavior:'smooth'});
}
function evaluate(){
 return config.solutions.map(sol=>{
  const hits=sol.signals.filter(sig=>{const [id,val]=sig.split(':');const v=getValue(id);return Array.isArray(v)?v.includes(val):v===val});
  const unknown=sol.signals.filter(sig=>{const [id]=sig.split(':');return getValue(id)===undefined||getValue(id)===null});
  const score=Math.min(100,Math.round(hits.length/Math.max(1,sol.signals.length)*100));
  return {...sol,hits,score,status:hits.length>=2?'recommended':hits.length===1?'needs_evidence':'not_applicable',unknown};
 }).filter(x=>x.status!=='not_applicable').sort((a,b)=>b.hits.length-a.hits.length||b.score-a.score);
}
function showDiagnostic(){
 const results=evaluate(),known=Object.entries(answers).filter(([,v])=>v.value!==null&&v.value!==''),unknown=Object.entries(answers).filter(([,v])=>v.value===null);
 const names=new Map(config.stages.flatMap(s=>s.questions.map(q=>[q.id,q.label])));
 const responseRows=known.map(([id,v])=>'<div class="flex justify-between gap-4 py-2 border-b text-sm" style="border-color:var(--border)"><span class="muted">'+esc(names.get(id)||id)+'</span><strong class="text-right">'+esc(Array.isArray(v.value)?v.value.join(', '):v.value)+'</strong></div>').join('');
 const solutionCards=results.length?results.map(r=>'<article class="solution"><div class="flex flex-wrap justify-between gap-2"><h3 class="font-semibold">'+esc(r.name)+'</h3><span class="pill">'+(r.status==='recommended'?'Sinal consistente':'Precisa de evidências')+'</span></div><p class="text-sm muted mt-2">'+esc(r.description)+'</p><div class="text-xs mt-3"><strong>'+r.hits.length+'</strong> sinal(is) compatível(is) identificado(s) · esforço: '+esc(r.effort)+'</div><div class="mt-3 text-xs"><strong>Indicadores:</strong> '+esc(r.metrics.join(' · '))+'</div><div class="mt-2 text-xs muted"><strong>Validar com:</strong> '+esc(r.evidence.join(' · '))+'</div></article>').join(''):'<p class="muted">Ainda não há combinações suficientes para sugerir soluções. Complete mais respostas ou revise os dados.</p>';
 shell('<div class="space-y-5"><section class="panel p-5 md:p-7"><span class="pill">RESULTADO DA DESCOBERTA</span><h1 class="text-2xl md:text-3xl font-semibold mt-3">Diagnóstico preliminar</h1><p class="muted mt-2">As recomendações abaixo são hipóteses baseadas nas respostas registradas. Não representam resultados comprovados nem substituem a validação das fontes.</p><div class="grid grid-cols-3 gap-3 mt-6"><div class="p-3 rounded-xl" style="background:var(--surface-2)"><div class="text-2xl font-semibold">'+known.length+'</div><div class="text-xs muted">Respostas preenchidas</div></div><div class="p-3 rounded-xl" style="background:var(--surface-2)"><div class="text-2xl font-semibold">'+unknown.length+'</div><div class="text-xs muted">Marcadas desconhecidas</div></div><div class="p-3 rounded-xl" style="background:var(--surface-2)"><div class="text-2xl font-semibold">'+results.length+'</div><div class="text-xs muted">Oportunidades sinalizadas</div></div></div></section><section class="panel p-5 md:p-7"><h2 class="text-xl font-semibold mb-4">Soluções possíveis</h2><div class="grid gap-3">'+solutionCards+'</div></section><section class="panel p-5 md:p-7"><h2 class="text-xl font-semibold mb-3">Respostas registradas</h2>'+responseRows+'</section><div class="flex flex-wrap justify-between gap-3"><button class="button button-secondary" id="review">Revisar respostas</button><button class="button button-primary" id="export">Exportar JSON</button></div></div>');
 document.getElementById('review').onclick=async()=>{showResults=false;index=config.stages.length-1;save();renderStage();await animate(document.getElementById('screen'),config.animations.enter,config.animations.enterDurationMs)};
 document.getElementById('export').onclick=()=>{const payload={schemaVersion:config.version,createdAt:new Date().toISOString(),source:handoffSource?'guilda':'discovery',missionId:handoffSource||undefined,answers,opportunities:results.map(({id,name,status,score,hits,metrics,evidence})=>({id,name,status,score,matchedSignals:hits,metrics,evidence}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='goaltropic-discovery.json';a.click();URL.revokeObjectURL(url)};
 const proposalPanel=document.createElement('section');proposalPanel.className='panel p-5 md:p-7';
 proposalPanel.innerHTML='<h2 class="text-xl font-semibold">Proposta de resultado</h2><p class="muted text-sm mt-2">Transmita suas respostas somente após consentir. O envio exige autenticação configurada pela aplicação; nenhuma credencial será salva neste navegador.</p><label class="option mt-4"><input id="proposalConsent" type="checkbox"><span><strong>Autorizo o envio das respostas desta descoberta para gerar uma proposta de resultado e submetê-la à revisão comercial.</strong><span class="block text-xs muted mt-1">As respostas serão enviadas ao servidor configurado. Não inclua dados sensíveis ou credenciais.</span></span></label><div class="flex flex-wrap gap-2 mt-4"><button class="button button-secondary" id="proposalPreview">Verificar prontidão</button><button class="button button-primary" id="proposalSubmit" disabled>Enviar descoberta para análise</button></div><div id="proposalStatus" class="text-sm mt-3" role="status" aria-live="polite"></div>';
 document.getElementById('screen').appendChild(proposalPanel);
 const consent=document.getElementById('proposalConsent'),previewButton=document.getElementById('proposalPreview'),submitButton=document.getElementById('proposalSubmit'),status=document.getElementById('proposalStatus');
 const proposalConfig=window.OaaSProposalConfig;
 const canConnect=!!(proposalConfig&&typeof proposalConfig.baseUrl==='string'&&typeof proposalConfig.getAccessToken==='function');
 const snapshot={source:handoffSource?'guilda':'discovery',missionId:handoffSource||undefined,updatedAt:new Date().toISOString(),answers};
 let readiness=null;
 const setStatus=(message,error=false)=>{status.textContent=message;status.className='text-sm mt-3 '+(error?'text-red-400':'muted')};
 const authorizedFetch=async(path,body,method='POST')=>{
  const token=await proposalConfig.getAccessToken();
  if(typeof token!=='string'||!token.trim())throw new Error('AUTHENTICATION_REQUIRED');
  const headers={'content-type':'application/json','authorization':'Bearer '+token};
  if(path==='/v1/proposals')headers['idempotency-key']=crypto.randomUUID();
  const base=new URL(proposalConfig.baseUrl,window.location.origin);const endpoint=new URL(base.pathname.replace(/\/$/,'')+path,base.origin);
  return fetch(endpoint,{method,headers,body:body?JSON.stringify(body):undefined,credentials:'omit',cache:'no-store'});
 };
 consent.addEventListener('change',()=>{submitButton.disabled=!consent.checked||!canConnect;readiness=null;submitButton.disabled=!consent.checked||!canConnect;setStatus(consent.checked?(canConnect?'Consentimento ativo nesta sessão. Você pode enviar a descoberta para análise comercial.':'API/auth não configuradas nesta aplicação.'):'Nenhum dado será enviado sem consentimento.');});
 if(!canConnect){previewButton.disabled=true;submitButton.disabled=true;setStatus('Envio remoto desabilitado: configure window.OaaSProposalConfig.baseUrl e getAccessToken() no host autenticado.');}
 previewButton.onclick=async()=>{
  if(!consent.checked){setStatus('Marque o consentimento explícito antes de transmitir.',true);return}
  previewButton.disabled=true;submitButton.disabled=true;setStatus('Verificando a proposta…');
  try{const response=await authorizedFetch('/v1/proposals/preview',{snapshot,options:{}});const data=await response.json();if(!response.ok)throw new Error(data.error||'PROPOSAL_PREVIEW_FAILED');readiness=data.value.readiness;const blockers=readiness?.blockers||[];setStatus(readiness?.status==='ready_for_review'?'Pronta para submissão à revisão humana.':('Ainda incompleta. Bloqueios: '+blockers.map(x=>x.code||x.message||String(x)).join('; ')));submitButton.disabled=!consent.checked||!canConnect;
  }catch(error){readiness=null;setStatus('Não foi possível verificar: '+(error.message||'erro de rede'),true)}
  finally{previewButton.disabled=false}
 };
 submitButton.onclick=async()=>{
  if(!consent.checked||!canConnect){setStatus('Consentimento e autenticação são obrigatórios.',true);return}
  submitButton.disabled=true;previewButton.disabled=true;setStatus('Enviando proposta…');
  try{const response=await authorizedFetch('/v1/proposals',{snapshot,options:{}});const data=await response.json();if(!response.ok)throw new Error(data.error||'PROPOSAL_SUBMIT_FAILED');setStatus('Descoberta enviada para análise comercial. Status: '+data.value.status+'. ID: '+data.value.proposal.id+(data.replayed?' (envio idempotente)':''));consent.checked=false;readiness=null;
  }catch(error){setStatus('Falha no envio: '+(error.message||'erro de rede'),true)}
  finally{previewButton.disabled=false;submitButton.disabled=!consent.checked||!canConnect}
 };
}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;document.body.dataset.theme=next;const t=next==='dark'?{bg:'#080B0F',surface:'#11161D',surface2:'#191F28',text:'#F2F2F0',muted:'#929AA5',accent:'#BC8E4F',border:'#29313C'}:{bg:'#F5F6F8',surface:'#FFFFFF',surface2:'#EDF0F4',text:'#171A20',muted:'#68717D',accent:'#92672D',border:'#D9DEE5'};const r=document.documentElement.style;r.setProperty('--bg',t.bg);r.setProperty('--surface',t.surface);r.setProperty('--surface-2',t.surface2);r.setProperty('--text',t.text);r.setProperty('--muted',t.muted);r.setProperty('--accent',t.accent);r.setProperty('--border',t.border)}
function reset(){if(!confirm('Apagar todas as respostas salvas desta descoberta?'))return;answers={};index=0;showResults=false;localStorage.removeItem(key);renderStage()}
if(showResults)showDiagnostic();else renderStage();
})();
</script>
</body></html>
