<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OaaS.Quest — Modo Guilda</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="guild-page" data-oaas-page="guild">
<div id="oaas-page-root"></div>
<script src="page-config.js"></script><script src="app.js"></script><script src="content.js"></script><script>
Promise.all([window.OQReady,window.OaaSPageReady]).then(()=>{
OQ.setMode("guilda","mode-opened");
const chat=document.getElementById("chat"),form=document.getElementById("composer"),input=document.getElementById("message");
const controls=document.getElementById("mission-controls"),audienceChoices=document.getElementById("audience-choices");
function updateCount(){document.getElementById("count").textContent=OQ.history("guilda").length+" mensagens registradas nesta jornada."}
function add(role,text){const row=document.createElement("div");row.className="chat-message "+(role==="user"?"user-message":"");const av=document.createElement("div");av.className="chat-avatar";av.textContent=role==="user"?"Você":"✧";const bubble=document.createElement("div");bubble.className="chat-bubble";bubble.textContent=text;row.append(av,bubble);chat.append(row);chat.scrollTop=chat.scrollHeight;OQ.logMessage("guilda",role,text);updateCount()}
function addLink(text,label,url){const row=document.createElement("div");row.className="chat-message";const av=document.createElement("div");av.className="chat-avatar";av.textContent="✧";const bubble=document.createElement("div");bubble.className="chat-bubble";const p=document.createElement("p");p.textContent=text;const a=document.createElement("a");a.href=url;a.className="mission-action-link";a.textContent=label;bubble.append(p,a);row.append(av,bubble);chat.append(row);chat.scrollTop=chat.scrollHeight}
function restore(){const old=OQ.history("guilda");old.forEach(m=>{const row=document.createElement("div");row.className="chat-message "+(m.role==="user"?"user-message":"");const av=document.createElement("div");av.className="chat-avatar";av.textContent=m.role==="user"?"Você":"✧";const b=document.createElement("div");b.className="chat-bubble";b.textContent=m.text;row.append(av,b);chat.append(row)});updateCount()}
function optionLabel(step,value){return step?.options?.find(o=>o.value===value)?.label||value}
function clearControls(){controls.replaceChildren()}
function renderStepControls(step){clearControls();input.placeholder=step.placeholder||"Digite sua resposta ou escolha uma opção...";if(step.options?.length){const group=document.createElement("div");group.className="mission-option-grid";step.options.forEach(option=>{const button=document.createElement("button");button.type="button";button.className="mission-option";button.textContent=option.label;button.addEventListener("click",()=>submitAnswer(option.value,option.label));group.append(button)});controls.append(group)}const skip=document.createElement("button");skip.type="button";skip.className="mission-skip";skip.textContent="Não sei ainda / pular esta pergunta";skip.addEventListener("click",()=>{add("user","Ainda não sei informar.");OQ.advanceMission(null,true);continueMission()});controls.append(skip)}
function askCurrentStep(){const step=OQ.currentMissionStep();if(!step){renderMissionReview(true);return}add("assistant",step.prompt);renderStepControls(step);input.value="";input.focus()}
function submitAnswer(value,label){if(!String(value||"").trim())return;add("user",label||value);OQ.advanceMission(String(value));continueMission()}
function continueMission(){const step=OQ.currentMissionStep();if(step)askCurrentStep();else renderMissionReview(true)}
function missionSummary(){const m=OQ.getMission(),labels={segment:"Setor",teamSize:"Tamanho da operação",desiredOutcome:"Resultado desejado",process:"Processo prioritário",challenge:"Principal obstáculo",deadline:"Horizonte",successMetric:"Indicador de sucesso"};return Object.keys(labels).map(key=>{const answer=m.answers[key];if(!answer||answer.value===null)return labels[key]+": ainda não informado";const step=OQ.missionSteps().find(s=>s.id===key);return labels[key]+": "+(step?.options?optionLabel(step,answer.value):answer.value)}).join("\n")}
function addControl(label,handler,primary=false){const button=document.createElement("button");button.type="button";button.className=primary?"mission-action mission-action-primary":"mission-action";button.textContent=label;button.addEventListener("click",handler);controls.append(button)}
function renderMissionReview(appendMessage){clearControls();input.placeholder="Você pode escrever uma observação ou pedir para revisar as respostas...";if(appendMessage)add("assistant","Este é o resumo inicial da sua missão:\n"+missionSummary()+"\n\nConfira as informações. Ainda não é um diagnóstico nem uma proposta; a próxima etapa aprofunda o contexto e procura evidências.");const status=OQ.getMission()?.status;if(status==="ready_for_discovery"){addControl("Aprofundar diagnóstico",goToDiscovery,true);addControl("Revisar respostas",()=>{OQ.reviseMission();askCurrentStep()});addControl("Recomeçar missão",restartMission)}else{addControl("Confirmar missão e aprofundar diagnóstico",confirmMission,true);addControl("Revisar respostas",()=>{OQ.reviseMission();askCurrentStep()});addControl("Recomeçar missão",restartMission)}}
function confirmMission(){OQ.confirmMission();add("user","Confirmo o resumo da missão.");add("assistant","Missão registrada neste navegador. Agora podemos aprofundar o diagnóstico, revisar processos e levantar as evidências necessárias antes de recomendar uma solução.");renderMissionReview(false)}
function goToDiscovery(){try{const result=OQ.prepareDiscovery();OQ.logInteraction("guilda","discovery-handoff",{prefilled:result.prefilled});window.location.href="descoberta/index.html"}catch(error){add("assistant","Não foi possível preparar o diagnóstico. Confirme primeiro o resumo da missão.")}}
function restartMission(){OQ.startMission("business");add("assistant","Vamos começar uma nova missão. As respostas anteriores permanecem no histórico desta conversa.");askCurrentStep()}
function startBusinessMission(){audienceChoices.hidden=true;OQ.startMission("business");add("assistant","Vamos registrar o objetivo em etapas curtas. Você pode responder com suas palavras ou pular qualquer pergunta. Ao final, poderá revisar tudo antes de continuar.");askCurrentStep()}
function startDeveloperPath(){audienceChoices.hidden=true;add("user","Sou desenvolvedor.");add("assistant","A trilha técnica reúne conceitos de OaaS, contratos, arquitetura, integração, automação e agentes. Você pode explorar a documentação e os fundamentos sem preencher o diagnóstico empresarial.");addLink("Acesse a área técnica para conhecer contratos, arquitetura e práticas de implementação.","Abrir área para desenvolvedores","classico.html#desenvolvedores")}
function restoreMission(){const mission=OQ.getMission();if(!mission)return;if(audienceChoices)audienceChoices.hidden=true;if(mission.status==="collecting"){const step=OQ.currentMissionStep();if(step)renderStepControls(step)}else if(mission.status==="review"||mission.status==="ready_for_discovery")renderMissionReview(false)}
restore();restoreMission();
document.querySelectorAll("[data-choice]").forEach(button=>button.addEventListener("click",()=>{if(button.dataset.choice==="Sou empresário"){add("user","Sou empresário.");OQ.logInteraction("guilda","audience-selected",{value:"business"});startBusinessMission()}else startDeveloperPath()}));
document.querySelector('[data-action="about"]').addEventListener("click",()=>{add("user","Quero saber mais sobre Outcome as a Service.");add("assistant","Outcome as a Service (OaaS) é uma abordagem orientada a resultados. Você define o resultado esperado; contexto, escopo, indicadores, evidências e condições de aceite são construídos em conjunto antes da execução. A solução pode combinar tecnologia, processos e pessoas.");OQ.logInteraction("guilda","about-oaas")});
form.addEventListener("submit",event=>{event.preventDefault();const value=input.value.trim();if(!value)return;const mission=OQ.getMission();if(mission?.status==="collecting"){submitAnswer(value,value);input.value="";return}if(mission?.status==="review"||mission?.status==="ready_for_discovery"){add("user",value);add("assistant","Sua observação foi registrada na conversa. Use “Revisar respostas” para reiniciar a revisão da missão ou confirme o resumo para aprofundar o diagnóstico.");input.value="";return}add("user",value);add("assistant","Para transformar isso em uma missão, escolha “Sou empresário”. Vou fazer algumas perguntas curtas e você poderá pular o que ainda não souber.");input.value=""});
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",()=>OQ.logInteraction("guilda","section-navigation",{target:a.getAttribute("href")})));
document.querySelectorAll('a[href$=".html"]').forEach(a=>a.addEventListener("click",()=>OQ.logInteraction("guilda","mode-navigation",{target:a.getAttribute("href")})));
});
</script></body></html>
